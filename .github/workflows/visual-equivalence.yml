name: Temporary visual equivalence — Martlet Core extraction
on:
  pull_request:
    branches: [develop]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/visual-equivalence.yml'
      - '.github/scripts/visual-compare.mjs'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: develop
          path: _baseline
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci && npm run build
      - run: npm ci && npm run build
        working-directory: _baseline
      - run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.64.1 pngjs@7 pixelmatch@6
      - run: npx playwright install --with-deps chromium
      - run: node .github/scripts/visual-compare.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: martlet-core-visual-parity
          path: artifacts/visual-parity/
          if-no-files-found: ignore
